sync:
  defaults:
    mode: "two-way-safe"
    hash: "xxh128"
    ignore:
      vcs: true
      paths:
        # === 编译产物（Linux .so 在 Mac 无用）===
        - "*.so"
        - "*.abi3.so"
        - "*.cpython-*.so"
        - "*.o"
        - "*.a"
        # === Python 缓存 ===
        - "__pycache__"
        - "*.pyc"
        - "*.pyo"
        - "*.pyd"
        - "*.egg-info"
        - ".eggs"
        - "*.egg"
        - "build"
        - "dist"
        - ".tox"
        - ".nox"
        - ".coverage"
        - ".coverage.*"
        - "htmlcov"
        - ".cache"
        - ".ipynb_checkpoints"
        - ".pyre"
        - ".pytype"
        - "cython_debug"
        # === 日志 ===
        - "logs"
        - "*.log"
        - "*.log.*"
        - "*.out"
        - "*.err"
        - "*.stdout"
        - "*.stderr"
        # === 数据库 ===
        - "*.db"
        - "*.db-wal"
        - "*.db-shm"
        - "*.sqlite"
        - "*.sqlite3"
        # === 模型权重/检查点 ===
        - "*.pt"
        - "*.bin"
        - "*.safetensors"
        - "*.ckpt"
        - "*.pth"
        - "*.gguf"
        # === 序列化数据 ===
        - "*.npy"
        - "*.npz"
        - "*.pkl"
        - "*.pickle"
        - "*.h5"
        - "*.hdf5"
        # === 大体积目录 ===
        - "wheels"
        - "outputs"
        - "wandb"
        - "scratch"
        - "uv_cache"
        - "hf_cache"
        - "triton_cache"
        - "flashinfer_cache"
        # === 环境/IDE ===
        - ".venv"
        - "venv"
        - "node_modules"
        - ".mypy_cache"
        - ".pytest_cache"
        - ".ruff_cache"
        - ".DS_Store"
        - "*.swp"
        - "*.swo"
        - ".env"
        - ".idea"
        - ".vscode"
        # === 临时/备份文件 ===
        - "*.tmp"
        - "*.temp"
        - "*.bak"
        - "*.orig"
        - "*.rej"
        - "*~"
        - "*.patch"
        - "*.diff"
    watch:
      mode: "portable"
      pollingInterval: 30
    permissions:
      mode: "portable"
      defaultFileMode: "0644"
      defaultDirectoryMode: "0755"
    compression:
      algorithm: "zstandard"
